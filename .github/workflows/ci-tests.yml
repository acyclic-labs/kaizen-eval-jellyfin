name: Tests
on:
  workflow_dispatch:
env:
  SDK_VERSION: "10.0.x"

jobs:
  run-tests:
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
      fail-fast: false

    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}
          # Cache the NuGet global-packages folder; versions are pinned centrally
          # in Directory.Packages.props, so key on it plus every project file.
          # Windows only: restore there takes ~65s uncached, while on Linux/macOS
          # (~15s) downloading the ~1 GiB cache costs more than it saves.
          cache: ${{ runner.os == 'Windows' }}
          cache-dependency-path: |
            Directory.Packages.props
            Directory.Build.props
            nuget.config
            **/*.csproj

      - name: Run DotNet CLI Tests
        run: >
          dotnet test Jellyfin.sln
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings tests/coverletArgs.runsettings
          --verbosity minimal

      - name: Merge code coverage results
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "**/coverage.cobertura.xml"
          targetdir: "merged/"
          reporttypes: "Cobertura"

      # TODO - which action / tool to use to publish code coverage results?
      # - name: Publish code coverage results
